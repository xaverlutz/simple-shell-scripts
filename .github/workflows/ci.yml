name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only read access is needed; nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships with the runner image; only zsh is missing.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Fail loudly rather than let `make lint` silently skip the zsh scripts.
      - name: Verify toolchain
        run: |
          shellcheck --version
          zsh --version

      - name: Lint
        run: make lint

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Run tests
        run: make test

      # macOS ships bash 3.2, where mapfile and other bash 4 builtins are
      # absent. Re-run the suite pinned to it.
      - name: Run tests under bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          TEST_SHELL=/bin/bash make test

  # Line coverage for the bash and zsh scripts (tests/coverage/), uploaded to
  # GitHub's code coverage, which comments on each PR with its coverage
  # against main. Pushes to main set that baseline. Needs Code Quality, with
  # code coverage analysis, enabled in the repository's settings.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
    steps:
      # The PR's head commit rather than the merge commit, so the reported
      # lines match the diff.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh

      - name: Run tests with coverage
        run: |
          make coverage
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get no write token, so they skip the upload.
      - name: Upload coverage to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: Shell
          label: code-coverage/bats

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/cobertura.xml
            coverage/lcov.info
            coverage/summary.md
            coverage/annotated/
          if-no-files-found: ignore

  install:
    name: install smoke test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: make install
        run: make install PREFIX="$RUNNER_TEMP/prefix"

      - name: Every script responds to --help
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          create_branch --help
          delete_local_branch --help
          reset_build --help
          send_location --help

      - name: make uninstall leaves nothing behind
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test -z "$(ls -A "$RUNNER_TEMP/prefix/bin")"

      # The checkout is a detached HEAD, so this also covers skipping the pull.
      - name: install.sh links the checkout and the updater
        run: |
          export BINDIR="$RUNNER_TEMP/linkbin"
          ./install.sh
          "$BINDIR/update_shell_scripts" --help
          "$BINDIR/create_branch" --help
          test ! -e "$BINDIR/install"

      # A fresh install from this checkout, which gets a tag to follow. The
      # checkout itself has no channel, so --only must refuse to narrow it.
      - name: install.sh --only links just that script, --all brings back the rest
        run: |
          export BINDIR="$RUNNER_TEMP/onlybin"
          if ./install.sh --only reset_build; then exit 1; fi
          git -c tag.gpgSign=false tag v99.0.0
          export SIMPLE_SHELL_SCRIPTS_REPO="file://$PWD" SIMPLE_SHELL_SCRIPTS_DIR="$RUNNER_TEMP/only-clone"
          bash -c "$(cat install.sh)" install.sh --only reset_build
          test "$(ls "$BINDIR" | paste -sd ' ' -)" = "reset_build update_shell_scripts"
          test ! -e "$SIMPLE_SHELL_SCRIPTS_DIR/create_branch.sh"
          "$BINDIR/update_shell_scripts" --all
          "$BINDIR/create_branch" --help
