name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the coverage job may also comment on PRs.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships with the runner image; only zsh is missing.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Fail loudly rather than let `make lint` silently skip the zsh scripts.
      - name: Verify toolchain
        run: |
          shellcheck --version
          zsh --version

      - name: Lint
        run: make lint

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Run tests
        run: make test

      # macOS ships bash 3.2, where mapfile and other bash 4 builtins are
      # absent. Re-run the suite pinned to it.
      - name: Run tests under bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          TEST_SHELL=/bin/bash make test

  # Line coverage for the bash and zsh scripts (tests/coverage/). On a pull
  # request it also measures the base commit and posts the comparison as a
  # comment, which later pushes to the PR update in place. Everything stays
  # on GitHub: no coverage service, nothing stored in the repository.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR's head commit rather than the merge commit, so the numbers are
      # for exactly what was pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh

      - name: Run tests with coverage
        run: |
          make coverage
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The base commit with its own scripts and tests, so the comparison is
      # like for like. A failing test there still leaves its report behind.
      - name: Coverage of the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE_SHA"
          git worktree add -q --detach "$RUNNER_TEMP/base" FETCH_HEAD
          if grep -q '^coverage:' "$RUNNER_TEMP/base/Makefile"; then
            make -C "$RUNNER_TEMP/base" coverage > /dev/null 2>&1 || true
          fi

      # One comment per PR, found again by the marker on its first line and
      # edited on every push. Fork PRs get a read-only token, so they only
      # have the step summary.
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_NAME: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          base="$RUNNER_TEMP/base/coverage/lcov.info"
          [ -s "$base" ] || base=/dev/null
          awk -v base_name="$BASE_NAME" -v base_sha="$BASE_SHA" \
              -v head_sha="$HEAD_SHA" -v run_url="$RUN_URL" \
              -f tests/coverage/compare.awk "$base" coverage/lcov.info > coverage/comment.md

          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id')
          id=${ids%%[[:space:]]*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage/comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@coverage/comment.md > /dev/null
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/summary.md
            coverage/comment.md
            coverage/annotated/
          if-no-files-found: ignore

  install:
    name: install smoke test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: make install
        run: make install PREFIX="$RUNNER_TEMP/prefix"

      - name: Every script responds to --help
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          create_branch --help
          delete_local_branch --help
          reset_build --help
          send_location --help

      - name: make uninstall leaves nothing behind
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test -z "$(ls -A "$RUNNER_TEMP/prefix/bin")"

      # The checkout is a detached HEAD, so this also covers skipping the pull.
      - name: install.sh links the checkout and the updater
        run: |
          export BINDIR="$RUNNER_TEMP/linkbin"
          ./install.sh
          "$BINDIR/update_shell_scripts" --help
          "$BINDIR/create_branch" --help
          test ! -e "$BINDIR/install"

      # A fresh install from this checkout, which gets a tag to follow. The
      # checkout itself has no channel, so --only must refuse to narrow it.
      - name: install.sh --only links just that script, --all brings back the rest
        run: |
          export BINDIR="$RUNNER_TEMP/onlybin"
          if ./install.sh --only reset_build; then exit 1; fi
          git -c tag.gpgSign=false tag v99.0.0
          export SIMPLE_SHELL_SCRIPTS_REPO="file://$PWD" SIMPLE_SHELL_SCRIPTS_DIR="$RUNNER_TEMP/only-clone"
          bash -c "$(cat install.sh)" install.sh --only reset_build
          test "$(ls "$BINDIR" | paste -sd ' ' -)" = "reset_build update_shell_scripts"
          test ! -e "$SIMPLE_SHELL_SCRIPTS_DIR/create_branch.sh"
          "$BINDIR/update_shell_scripts" --all
          "$BINDIR/create_branch" --help
