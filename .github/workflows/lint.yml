name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Lint
        run: make lint

  install:
    name: install smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: make install
        run: make install PREFIX="$RUNNER_TEMP/prefix"

      - name: Scripts are executable and --help works
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          create_branch --help
          reset_build --help
          send_location --help

      - name: make uninstall leaves nothing behind
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test -z "$(ls -A "$RUNNER_TEMP/prefix/bin")"
